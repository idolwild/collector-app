<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#08080a" id="theme-color-meta" />
    <script>
      // Apply saved theme before first paint (dark default; OS light on first run).
      try {
        var __t = localStorage.getItem('collector_theme');
        if (!__t && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) __t = 'light';
        document.documentElement.dataset.theme = __t === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Collector" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Collector — Art Inventory</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="./db.js"></script>
    <script src="./color.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
